<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Proveedores</h2>
  <button class="btn btn-primary" (click)="openForm()">+ Agregar</button>
</div>

@if (showForm) {
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ editingId ? 'Editar' : 'Nuevo' }} Proveedor</h5>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="form.nombre" placeholder="Nombre del proveedor" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input type="text" class="form-control" [(ngModel)]="form.telefono" placeholder="Ej: 76543210" />
        </div>
      </div>
      <div class="mt-3">
        <button class="btn btn-success me-2" (click)="save()">Guardar</button>
        <button class="btn btn-secondary" (click)="cancel()">Cancelar</button>
      </div>
    </div>
  </div>
}

<div class="card shadow-sm">
  <div class="card-body p-0">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (item of proveedores; track item.id) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.nombre }}</td>
            <td>{{ item.telefono }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-warning me-1" (click)="edit(item)">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(item.id!)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center text-muted py-3">No hay proveedores registrados</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
